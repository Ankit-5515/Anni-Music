name: Anni Music CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job 1: Backend API Continuous Integration (Node 20 + Prisma + TypeScript)
  # ==========================================================================
  backend-ci:
    name: Backend CI (Fastify + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anni
          POSTGRES_PASSWORD: anni_test_password
          POSTGRES_DB: anni_music_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://anni:anni_test_password@localhost:5432/anni_music_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_jwt_access_secret_key_for_ci_pipeline_32_bytes
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_for_ci_pipeline_32_bytes
      AUDIUS_APP_NAME: AnniMusicCI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Build Production TypeScript Bundle
        run: npm run build

  # ==========================================================================
  # Job 2: Flutter Mobile Application Continuous Integration
  # ==========================================================================
  flutter-ci:
    name: Flutter CI (Analyze, Test & Debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Patch Flutter IconData for legacy icon packages
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "Flutter installed at: $FLUTTER_DIR"
          ICON_DATA_FILE="$FLUTTER_DIR/packages/flutter/lib/src/widgets/icon_data.dart"
          if [[ -f "$ICON_DATA_FILE" ]]; then
            sed -i 's/final class IconData/class IconData/g; s/base class IconData/class IconData/g' "$ICON_DATA_FILE"
            echo "Patched IconData in $ICON_DATA_FILE"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Dart Codebase
        run: |
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || {
            echo "### Flutter Analyze Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 analyze.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Flutter Widget & Unit Tests
        run: flutter test

      - name: Build Debug APK
        run: |
          flutter build apk --debug \
            --android-skip-build-dependency-validation \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://anni-music-api.onrender.com/api/v1' }} 2>&1 | tee build_debug.log || {
              echo "### Debug APK Build Output" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 120 build_debug.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anni-Music-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
