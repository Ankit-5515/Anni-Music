# ============================================================================
# Render.com Blueprint — Anni Music Cloud Backend Deployment
# Provides an instant public HTTPS URL: https://anni-music-api.onrender.com
# ============================================================================

services:
  # Fastify REST & Streaming API
  - type: web
    name: anni-music-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: anni-music-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: anni-music-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"
      - key: AUDIUS_APP_NAME
        value: "AnniMusic"
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        value: "*"

  # Managed Redis Instance
  - type: redis
    name: anni-music-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # Managed PostgreSQL 16 Instance
  - name: anni-music-db
    databaseName: anni_music
    user: anni
    plan: free
    region: oregon
    postgresMajorVersion: "16"
