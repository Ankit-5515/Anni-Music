name: anni_music
description: "Anni Music — Your music. Your world. Hybrid Offline Local Library & Legal Streaming Super-App."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  just_audio: ^0.9.39
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  on_audio_query: ^2.9.0
  file_picker: ^8.0.6
  audio_metadata_reader: ^1.1.0
  palette_generator: ^0.3.3+4
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  youtube_player_iframe: ^5.1.3
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  home_widget: ^0.6.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
